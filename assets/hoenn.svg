<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 480 160" shape-rendering="crispEdges">
    <!-- Paisaje de la portada y del login. Las coordenadas dibujan las piezas del pixel art. -->
    <!-- Aquí guardamos la hierba, el árbol y la flor para reutilizarlos en el paisaje. -->
    <defs>
        <!-- Textura que se repite en el suelo. -->
        <pattern id="grass" width="16" height="16" patternUnits="userSpaceOnUse">
            <path fill="#8bc878" d="M0 0h16v16H0z"/>
            <path fill="#72b66b" d="M3 7h2V5h2v4H3zm8 7h2v-3h2v5h-4z"/>
        </pattern>
        <!-- Árbol reutilizable; cada use lo coloca en una posición. -->
        <g id="tree">
            <path fill="#477548" d="M14 30h7v13h-7z"/>
            <path fill="#285f4f" d="M6 13h23v23H6zM1 21h33v10H1z"/>
            <path fill="#438653" d="M10 1h15v5h6v10h4v9H0v-9h5V6h5z"/>
            <path fill="#65a85b" d="M11 3h12v5h6v6H5V9h6z"/>
            <path fill="#87c365" d="M12 3h10v4H12z"/>
            <path fill="#39744e" d="M5 24h25v5H5z"/>
        </g>
        <!-- Flor pequeña para decorar la hierba. -->
        <g id="flower">
            <path fill="#e87583" d="M1 0h3v5H1zM0 1h5v3H0z"/>
            <path fill="#ffe8a2" d="M2 2h1v1H2z"/>
        </g>
    </defs>
    <!-- Fondo del cielo, nubes y montañas. -->
    <path fill="#a6dcd4" d="M0 0h480v160H0z"/>
    <path fill="#d8f1dc" d="M10 22h35v-6h30v6h14v7H10zm155-8h30V8h21v6h30v8h-81zm166 7h22v-7h28v7h22v8h-72z"/>
    <path fill="#6cab80" d="M0 65h24V49h26V34h30v17h25v14h28V42h28V29h30v22h31v17h30V50h39V34h25v19h39v14h38V42h40V30h29v20h28v110H0z"/>
    <!-- Suelo de hierba y camino que cruza el paisaje. -->
    <path fill="url(#grass)" d="M0 82h480v78H0z"/>
    <path fill="#cfb579" d="M0 120h277V94h45v34h158v21H300v-10H0z"/>
    <path fill="#eed598" d="M0 124h282V98h35v34h163v13H304v-10H0z"/>
    <!-- Estanque y pequeños reflejos sobre el agua. -->
    <path fill="#548fa3" d="M361 93h119v29H348v-20h13z"/>
    <path fill="#73c5c7" d="M365 97h115v21H352v-12h13z"/>
    <path stroke="#c2e7d0" stroke-width="2" d="M373 103h19m21 8h19m28-8h20m-118 10h12"/>
    <g>
        <use href="#tree" x="19" y="63"/>
        <use href="#tree" x="47" y="73"/>
        <use href="#tree" x="90" y="59"/>
        <use href="#tree" x="125" y="71"/>
        <use href="#tree" x="173" y="62"/>
        <use href="#tree" x="348" y="52"/>
        <use href="#tree" x="394" y="57"/>
        <use href="#tree" x="429" y="49"/>
        <use href="#tree" x="456" y="62"/>
    </g>
    <!-- Edificio central: paredes, tejado, ventanas y puerta. -->
    <path fill="#5e6658" d="M230 68h52v45h-52z"/>
    <path fill="#faf0bf" d="M233 71h46v39h-46z"/>
    <path fill="#ba5465" d="M224 63h64v16h-64z"/>
    <path fill="#e78480" d="M230 54h52v9h-52z"/>
    <path fill="#f2a293" d="M234 51h44v5h-44z"/>
    <path fill="#843d57" d="M224 76h64v4h-64z"/>
    <path fill="#76b3b4" d="M237 86h11v12h-11zm28 0h10v12h-10z"/>
    <path fill="#536b70" d="M252 91h10v19h-10z"/>
    <path fill="#fff4d3" d="M251 62h12v9h-12z"/>
    <path fill="#d66c71" d="M255 62h4v9h-4zm-4 3h12v3h-12z"/>
    <g>
        <use href="#flower" x="203" y="106"/>
        <use href="#flower" x="212" y="101"/>
        <use href="#flower" x="192" y="105"/>
        <use href="#flower" x="332" y="151"/>
        <use href="#flower" x="342" y="147"/>
        <use href="#flower" x="120" y="146"/>
    </g>
    <!-- Entrenador: estas piezas se desplazan juntas a la posición indicada. -->
    <g transform="translate(322 115)">
        <path fill="#4c5461" d="M3 11h11v4H3zM4 20h4v4H4zm8 0h4v4h-4z"/>
        <path fill="#f5d5a1" d="M4 5h12v7H4z"/>
        <path fill="#ed766a" d="M2 2h13v5H2zM5 0h8v2H5zM4 13h11v8H4z"/>
        <path fill="#fff1c9" d="M3 2h8v3H3z"/>
        <path fill="#33495c" d="M14 7h2v2h-2z"/>
    </g>
    <!-- Pequeño Pikachu que acompaña al entrenador. -->
    <g transform="translate(343 130)">
        <path fill="#795b3a" d="M0 2h3v9H0zm11 0h3v10h-3z"/>
        <path fill="#f4cc57" d="M0 5h3v7H0zm11-2h3v9h-3zM2 9h10v10H2zm3 10h9v4H5zm10-7h5v3h-3v5h-3z"/>
        <path fill="#3f4d48" d="M3 12h2v2H3zm6 0h2v2H9z"/>
        <path fill="#e97658" d="M2 15h2v2H2zm8 0h2v2h-2z"/>
    </g>
    <use href="#tree" x="12" y="136"/>
    <use href="#tree" x="52" y="142"/>
    <use href="#tree" x="396" y="137"/>
    <use href="#tree" x="439" y="140"/>
</svg>
